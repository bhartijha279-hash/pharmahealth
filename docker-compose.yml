services:

  postgres-db:
    image: postgres:16-alpine
    container_name: pharmahealth_postgres
    restart: always
    environment:
      POSTGRES_DB: pharmahealth
      POSTGRES_USER: pharma_user
      POSTGRES_PASSWORD: pharma_password
    # Not published to the host, to avoid clashing with a local database; the backend reaches it on the compose network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma_user -d pharmahealth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmahealth_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/pharmahealth
      SPRING_DATASOURCE_USERNAME: pharma_user
      SPRING_DATASOURCE_PASSWORD: pharma_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me}
      JWT_EXPIRATION: 86400000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO_DATA: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmahealth_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
