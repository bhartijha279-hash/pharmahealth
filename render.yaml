# Render Blueprint: Spring Boot backend only.
# Frontend is hosted on Vercel (see frontend/vercel.json), database on Supabase (PostgreSQL).
services:
  - type: web
    name: pharmahealth-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/public/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Supabase -> Connect -> "Session pooler" (IPv4). Format:
      # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      # Session pooler user, e.g. postgres.<project-ref>
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      # Password for the built-in "admin" account (only applied when the account is first created)
      - key: ADMIN_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://pharmahealth.vercel.app (comma-separate several)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      # Keep the JVM inside the free instance's 512 MB
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"
