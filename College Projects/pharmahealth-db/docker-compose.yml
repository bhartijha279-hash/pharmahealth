services:

  mysqldb:
    image: mysql:8.0
    container_name: pharmahealth-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: pharmahealth_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pharmahealth-net

  backend:
    build:
      context: ./College Projects/pharmahealth-db
      dockerfile: Dockerfile
    container_name: pharmahealth-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/pharmahealth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpass
    ports:
      - "8080:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - pharmahealth-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmahealth-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pharmahealth-net

volumes:
  db_data:

networks:
  pharmahealth-net:
    driver: bridge